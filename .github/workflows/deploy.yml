# Construit le site à chaque modification, vérifie les liens, puis publie sur l'hébergeur.
# La publication par rsync ne s'active que si la variable de dépôt DEPLOY_ENABLED vaut "true"
# et que les secrets DEPLOY_* sont renseignés (voir README).
# Cloudflare Pages construit et publie le site lui-même à chaque push ; chaque matin,
# le job rebuild-cloudflare lui demande en plus une reconstruction (secret CLOUDFLARE_DEPLOY_HOOK).
name: Construire et publier le site

on:
  push:
    branches: [main]
  pull_request:
  # Chaque matin : publie automatiquement les articles dont la date est arrivée.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer Hugo (version épinglée dans .hugo-version)
        run: |
          HUGO_VERSION="$(cat .hugo-version)"
          curl -fsSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Construire
        run: hugo --gc --minify

      - name: Vérifier les liens et l'absence de ressources externes
        run: python3 scripts/check_site.py public

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Publier par rsync (SSH)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH%/}/"

  # Cloudflare Pages ne reconstruit le site qu'à chaque push. Chaque matin, ce job
  # appelle son « deploy hook » pour publier les articles dont la date est arrivée.
  rebuild-cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Demander une reconstruction à Cloudflare Pages
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "Secret CLOUDFLARE_DEPLOY_HOOK absent : rien à faire."
            exit 0
          fi
          curl -fsS -X POST "$CLOUDFLARE_DEPLOY_HOOK" > /dev/null
          echo "Reconstruction demandée."
