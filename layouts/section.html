{{ define "main" }}
<header class="page-hero">
  <div class="container narrow">
    <p class="eyebrow eyebrow-light">Ressources</p>
    <h1>{{ .Title }}</h1>
    {{- with .Params.lead }}<p class="page-lead">{{ . }}</p>{{ end }}
  </div>
</header>
<div class="section">
  <div class="container">
    <div class="cards cards-3">
      {{- range .Pages.ByDate.Reverse }}{{ partial "article-card.html" . }}{{ end }}
    </div>
  </div>
</div>
{{ partial "cta.html" . }}
{{ end }}
