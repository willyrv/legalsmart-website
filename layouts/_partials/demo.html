{{- /* Illustration fidèle de l'assistant documentaire, avec un document fictif. */ -}}
<figure class="demo">
  <div class="demo-window" role="img" aria-label="Exemple : l'assistant répond à une question sur un contrat et cite l'article utilisé.">
    <div class="demo-bar" aria-hidden="true"><i></i><i></i><i></i><span>Assistant documentaire du cabinet</span></div>
    <div class="demo-body" aria-hidden="true">
      <p class="demo-q">Quel préavis faut-il respecter pour ne pas renouveler le contrat Durand&nbsp;?</p>
      <div class="demo-a">
        <p>Le contrat se renouvelle tacitement par périodes de douze mois. Pour ne pas le renouveler, il doit être dénoncé par lettre recommandée avec accusé de réception, <strong>trois mois avant l'échéance</strong> <span class="cite">1</span>.</p>
        <div class="demo-source">
          <p class="demo-source-head"><span class="cite">1</span> Contrat de prestation — Durand Industries · Article 2 — Durée · p.&nbsp;1</p>
          <p class="demo-extrait">« … renouvelé tacitement par périodes successives de douze (12) mois, sauf dénonciation par l'une des parties par lettre recommandée avec accusé de réception moyennant un préavis de trois (3) mois avant l'échéance. »</p>
        </div>
        <p class="demo-meta"><span class="pill">Hébergé sur site</span> Espace « Dossier Durand » · Secret professionnel</p>
      </div>
    </div>
  </div>
  <figcaption>Illustration réalisée avec un document fictif. La réponse indique le passage exact : un clic suffit pour vérifier.</figcaption>
