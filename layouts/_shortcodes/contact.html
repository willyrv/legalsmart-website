{{- $c := site.Params.contact -}}
<div class="contact-cards">
  <a class="contact-card" href="mailto:{{ $c.email }}?subject={{ replace ("Demande d'atelier découverte" | urlquery) "+" "%20" }}">
    <span class="contact-label">E-mail</span><span>{{ $c.email }}</span>
  </a>
  {{- with $c.phone }}
  <button type="button" class="contact-card" data-tel="{{ partial "tel-code.html" . }}" hidden><span class="contact-label">Téléphone</span><span data-tel-text>Afficher le numéro</span></button>
  {{- end }}
  <a class="contact-card" href="{{ $c.linkedin }}" rel="me noopener"><span class="contact-label">LinkedIn</span><span>{{ $c.name }}</span></a>
  {{- with $c.booking_url }}
  <a class="contact-card" href="{{ . }}" rel="noopener"><span class="contact-label">Rendez-vous</span><span>Choisir un créneau</span></a>
  {{- end }}
</div>
